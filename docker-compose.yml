# Entorno local NexoUrbano — recortar servicios si la RAM es justa.
# Mínimo viable en 8 GB RAM: mysql + mongo + cassandra (uno a la vez) + neo4j.
# Hadoop/Hive/HBase: usar el sandbox que indique la cátedra si este compose no levanta.
#
#   docker compose up -d mysql mongo
#   docker compose up -d neo4j
#
# Los puertos son los de factory. Cambiar si chocan con algo local.

services:
  mysql:
    image: mysql:8.4
    container_name: nexo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nexo
      MYSQL_DATABASE: crm
    ports:
      - "3307:3307"
    volumes:
      - ./data/mysql/crm_riders.sql:/docker-entrypoint-initdb.d/01_crm.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-pnexo"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    container_name: nexo-mongo
    restart: unless-stopped
    ports:
      - "27018:27018"
    volumes:
      - mongo_data:/data/db

  cassandra:
    image: cassandra:5
    container_name: nexo-cassandra
    restart: unless-stopped
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - cassandra_data:/var/lib/cassandra

  neo4j:
    image: neo4j:5-community
    container_name: nexo-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/nexo-urban-2026
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: nexo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nexo
      MINIO_ROOT_PASSWORD: nexo-urban-2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
  hadoop:
    image: apache/hadoop:3
    container_name: nexo-hadoop
    hostname: hadoop
    restart: unless-stopped
    ports:
      - "9870:9870"
      - "8088:8088"
    environment:
      CORE-SITE.XML_fs.defaultFS: "hdfs://hadoop:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-address: "hadoop:8020"
      HDFS-SITE.XML_dfs.namenode.rpc-bind-host: "0.0.0.0"
      HDFS-SITE.XML_dfs.replication: "1"
    command: >
      bash -c "
      [ -d /tmp/hadoop-hadoop/dfs/name/current ] || /opt/hadoop/bin/hdfs namenode -format -force;
      /opt/hadoop/bin/hdfs --daemon start namenode;
      /opt/hadoop/bin/hdfs --daemon start datanode;
      tail -f /dev/null"

  spark:
    image: apache/spark:3.5.3
    container_name: nexo-spark
    restart: unless-stopped
    command: tail -f /dev/null
    ports:
      - "4040:4040"
    volumes:
      - ./05-spark:/opt/spark-apps
      - ./data:/opt/spark-data:ro
      - spark_lake:/opt/spark-lake



volumes:
  mysql_data:
  mongo_data:
  cassandra_data:
  neo4j_data:
  minio_data:
  spark_lake:
